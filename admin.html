<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal — Assam Limbu Mahasabha</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* Keep existing admin styles... */
        .admin-login-form { max-width: 400px; margin: 0 auto; background: var(--color-surface-alt); padding: var(--spacing-lg); border-radius: var(--radius-lg); border: 1px solid var(--color-border); }
        .admin-login-form input { width: 100%; padding: 0.7rem 1rem; margin-bottom: var(--spacing-md); border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 1rem; font-family: inherit; box-sizing: border-box; }
        .admin-login-form input:focus { outline: none; border-color: var(--color-primary); }
        .admin-login-form .btn { width: 100%; }
        .admin-dashboard { display: none; }
        .admin-dashboard.visible { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--spacing-md); margin-bottom: var(--spacing-lg); }
        .admin-header h2 { margin: 0; }
        .admin-role-badge { background: var(--color-primary); color: #fff; padding: 0.2rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: var(--font-medium); }
        .admin-app-table { width: 100%; border-collapse: collapse; margin-top: var(--spacing-md); }
        .admin-app-table th, .admin-app-table td { border: 1px solid var(--color-border); padding: 0.5rem; text-align: left; font-size: 0.9rem; }
        .admin-app-table th { background: var(--color-surface-alt); font-weight: var(--font-medium); }
        .admin-app-table .actions { display: flex; gap: var(--spacing-xs); flex-wrap: wrap; }
        .admin-app-table .actions .btn { padding: 0.2rem 0.6rem; font-size: 0.8rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; padding: var(--spacing-md); overflow-y: auto; }
        .modal.visible { display: flex; }
        .modal-content { background: var(--color-surface); max-width: 800px; width: 100%; border-radius: var(--radius-lg); padding: var(--spacing-lg); box-shadow: var(--shadow-lg); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; }
        .modal-content .close { position: sticky; top: 0; float: right; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--color-text-muted); }
        .modal-content .close:hover { color: var(--color-text); }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm); }
        .detail-item { padding: 0.3rem 0; border-bottom: 1px solid var(--color-border); }
        .detail-item .label { font-weight: var(--font-medium); color: var(--color-text-muted); display: inline-block; width: 40%; }
        .detail-item .value { color: var(--color-text); display: inline-block; width: 58%; }
        .certificate-preview { background: #fff; padding: 30px; border: 1px solid #ccc; margin-top: var(--spacing-md); border-radius: var(--radius); }
        .certificate-preview .header { text-align: center; border-bottom: 2px solid #1a3a5c; padding-bottom: 10px; margin-bottom: 20px; }
        .certificate-preview .header .emblem { font-size: 2.5rem; color: #1a3a5c; }
        .certificate-preview .header h2 { margin: 5px 0; }
        .certificate-preview .header p { margin: 0; color: #475569; }
        .certificate-preview .body { display: flex; gap: 30px; align-items: flex-start; }
        .certificate-preview .body .text { flex: 1; }
        .certificate-preview .body .photo { flex-shrink: 0; }
        .certificate-preview .body .photo img { width: 100px; height: 100px; object-fit: cover; border-radius: 3px; border: 1px solid #ddd; }
        @media (max-width: 768px) {
            .certificate-preview .body { flex-direction: column; align-items: center; }
            .detail-grid { grid-template-columns: 1fr; }
            .admin-app-table { font-size: 0.8rem; }
            .admin-app-table th, .admin-app-table td { padding: 0.3rem; }
        }
    </style>
</head>
<body>
    <div class="site-shell">
        <header class="site-header" role="banner">
            <!-- same header as before -->
        </header>
        <main class="site-main" role="main">
            <section class="hero-section full-width" style="min-height: 30vh; background: var(--color-primary-dark);">
                <div class="hero-content" style="grid-template-columns: 1fr;">
                    <div class="hero-text" style="max-width: 800px; text-align: center; margin: 0 auto;">
                        <p class="hero-tag">Admin Portal</p>
                        <h1 style="font-size: 2.8rem;">Membership Application Management</h1>
                        <p class="hero-description" style="max-width: 600px; margin: 0 auto;">Secure admin panel for Dealing Assistant, President, and Approving Authority.</p>
                    </div>
                </div>
            </section>
            <section class="full-width" style="background: var(--color-surface); border-bottom: 1px solid var(--color-border);">
                <div class="section-content">
                    <div id="loginSection" class="admin-login-section">
                        <h2>Login</h2>
                        <form id="loginForm" class="admin-login-form">
                            <input type="email" id="loginEmail" placeholder="Email" required />
                            <input type="password" id="loginPassword" placeholder="Password" required />
                            <div id="loginError" class="error-message">Invalid credentials.</div>
                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </form>
                    </div>
                    <div id="dashboard" class="admin-dashboard">
                        <div class="admin-header">
                            <div><h2>Dashboard</h2><span id="roleBadge" class="admin-role-badge">Role</span></div>
                            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                        </div>
                        <div id="appListContainer"></div>
                    </div>
                </div>
            </section>
        </main>
        <!-- MODALS -->
        <div id="viewModal" class="modal">
            <div class="modal-content">
                <button class="close" data-modal="viewModal">&times;</button>
                <h3>Application Details</h3>
                <div id="viewContent"></div>
            </div>
        </div>
        <div id="certificateModal" class="modal">
            <div class="modal-content">
                <button class="close" data-modal="certificateModal">&times;</button>
                <h3>Certificate Preview</h3>
                <div id="certificateContent"></div>
            </div>
        </div>
        <div id="remarkModal" class="modal">
            <div class="modal-content">
                <h3 id="modalTitle">Add Remarks</h3>
                <textarea id="remarkText" rows="4" placeholder="Enter your remarks..."></textarea>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                    <button class="btn btn-primary" id="modalConfirm">Submit</button>
                </div>
            </div>
        </div>
        <div id="toast" class="toast"></div>
        <footer class="site-footer" role="contentinfo">
            <!-- same footer -->
        </footer>
    </div>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"
            }
        }
    </script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
        import { getDatabase, ref, get, update, onValue } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyDp0cacuoIiLmdSjC96KSHnZkhk27S7bXI",
            authDomain: "assam-limbu-mahasabha-257ee.firebaseapp.com",
            projectId: "assam-limbu-mahasabha-257ee",
            storageBucket: "assam-limbu-mahasabha-257ee.firebasestorage.app",
            messagingSenderId: "684300836537",
            appId: "1:684300836537:web:f1080b30569f9b79634568"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // DOM elements
        const loginSection = document.getElementById('loginSection');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const roleBadge = document.getElementById('roleBadge');
        const appListContainer = document.getElementById('appListContainer');
        const viewModal = document.getElementById('viewModal');
        const viewContent = document.getElementById('viewContent');
        const certificateModal = document.getElementById('certificateModal');
        const certificateContent = document.getElementById('certificateContent');
        const remarkModal = document.getElementById('remarkModal');
        const modalTitle = document.getElementById('modalTitle');
        const remarkText = document.getElementById('remarkText');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');
        const toast = document.getElementById('toast');

        let currentUser = null, currentRole = null, currentAppKey = null, currentAction = null;

        function showToast(msg) { toast.textContent = msg; toast.classList.add('visible'); setTimeout(() => toast.classList.remove('visible'), 3000); }
        function now() { return new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }); }

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();
            loginError.classList.remove('visible');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = error.message;
                loginError.classList.add('visible');
            }
        });

        // Auth state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const snapshot = await get(ref(db, `users/${user.uid}`));
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    const role = userData.role;
                    if (role) {
                        currentRole = role;
                        loginSection.style.display = 'none';
                        dashboard.classList.add('visible');
                        roleBadge.textContent = role;
                        loadApplications(role);
                        return;
                    }
                }
                alert('No role assigned. Contact admin.');
                await signOut(auth);
            } else {
                currentUser = null; currentRole = null;
                loginSection.style.display = 'block';
                dashboard.classList.remove('visible');
                appListContainer.innerHTML = '';
            }
        });

        logoutBtn.addEventListener('click', async () => { await signOut(auth); });

        // Load applications with table view
        function loadApplications(role) {
            const appsRef = ref(db, 'applications');
            onValue(appsRef, (snapshot) => {
                if (!snapshot.exists()) {
                    appListContainer.innerHTML = '<div class="admin-empty">No applications found.</div>';
                    return;
                }
                const allApps = snapshot.val();
                const appKeys = Object.keys(allApps);
                let filtered = [];
                if (role === 'DA') {
                    filtered = appKeys.filter(key => {
                        const app = allApps[key];
                        return app.status === 'Submitted' || app.currentStage === 'DA' || !app.currentStage;
                    });
                } else if (role === 'President') {
                    filtered = appKeys.filter(key => {
                        const app = allApps[key];
                        return app.currentStage === 'President';
                    });
                } else if (role === 'AA') {
                    filtered = appKeys.filter(key => {
                        const app = allApps[key];
                        return app.currentStage === 'AA';
                    });
                }

                if (filtered.length === 0) {
                    appListContainer.innerHTML = '<div class="admin-empty">No applications pending for your action.</div>';
                    return;
                }

                let html = `
                    <table class="admin-app-table">
                        <thead><tr>
                            <th>Ref No</th>
                            <th>Applicant</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr></thead>
                        <tbody>
                `;
                filtered.forEach(key => {
                    const app = allApps[key];
                    const name = `${app.firstName || ''} ${app.secondName || ''}`.trim() || 'N/A';
                    const refNum = app.refNumber || 'N/A';
                    const date = app.timestamp || 'N/A';
                    const status = app.status || 'Submitted';

                    let actionsHTML = `
                        <button class="btn btn-secondary" data-action="view" data-key="${key}">View</button>
                    `;
                    if (role === 'DA') {
                        actionsHTML += `
                            <button class="btn btn-secondary" data-action="remark" data-key="${key}">Remark</button>
                            <button class="btn btn-primary" data-action="forward" data-key="${key}">Forward to President</button>
                        `;
                    } else if (role === 'President') {
                        actionsHTML += `
                            <button class="btn btn-secondary" data-action="remark" data-key="${key}">Remark</button>
                            <button class="btn btn-primary" data-action="forward" data-key="${key}">Forward to AA</button>
                        `;
                    } else if (role === 'AA') {
                        actionsHTML += `
                            <button class="btn btn-secondary" data-action="remark" data-key="${key}">Remark</button>
                            <button class="btn btn-success" data-action="approve" data-key="${key}">Approve</button>
                            <button class="btn btn-danger" data-action="reject" data-key="${key}">Reject</button>
                            <button class="btn btn-info" data-action="previewcert" data-key="${key}">Preview Cert</button>
                        `;
                    }
                    html += `
                        <tr>
                            <td>${refNum}</td>
                            <td>${name}</td>
                            <td>${status}</td>
                            <td>${date}</td>
                            <td><div class="actions">${actionsHTML}</div></td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                appListContainer.innerHTML = html;

                // Attach event listeners
                document.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const action = btn.dataset.action;
                        const key = btn.dataset.key;
                        currentAppKey = key;
                        const appData = allApps[key];
                        if (action === 'view') {
                            openViewModal(appData);
                        } else if (action === 'previewcert') {
                            openCertificatePreview(appData);
                        } else if (action === 'remark') {
                            modalTitle.textContent = 'Add Remarks';
                            remarkText.value = '';
                            currentAction = 'remark';
                            remarkModal.classList.add('visible');
                        } else if (action === 'forward') {
                            modalTitle.textContent = 'Forward Application';
                            remarkText.value = '';
                            currentAction = 'forward';
                            remarkModal.classList.add('visible');
                        } else if (action === 'approve') {
                            if (confirm('Approve this application?')) {
                                updateApplicationStatus(key, 'Approved', 'AA', 'Application approved.');
                            }
                        } else if (action === 'reject') {
                            if (confirm('Reject this application?')) {
                                updateApplicationStatus(key, 'Rejected', 'AA', 'Application rejected.');
                            }
                        }
                    });
                });
            });
        }

        // Open View Modal
        function openViewModal(app) {
            const fields = [
                'refNumber', 'firstName', 'secondName', 'dob', 'email', 'phone', 'altPhone',
                'education', 'bloodGroup', 'district', 'lac', 'village', 'postOffice', 'ps', 'pin',
                'familyStatus', 'totalFamily', 'houseType', 'landOwnership', 'vehicle', 'beltBlock',
                'autonomousCouncil', 'govtScheme', 'govtEmployees', 'membershipType', 'status', 'timestamp'
            ];
            let html = '<div class="detail-grid">';
            fields.forEach(f => {
                if (app[f]) {
                    html += `<div class="detail-item"><span class="label">${f.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase())}</span><span class="value">${app[f]}</span></div>`;
                }
            });
            // Photo
            if (app.photoURL) {
                html += `<div class="detail-item" style="grid-column:1/-1;"><span class="label">Photo</span><span class="value"><img src="${app.photoURL}" alt="Applicant photo" style="max-width:120px; border-radius:3px; border:1px solid #ddd;" /></span></div>`;
            }
            // History
            if (app.history && app.history.length) {
                html += `<div style="grid-column:1/-1; margin-top:var(--spacing-md);"><h4>Processing History</h4><ul>`;
                app.history.forEach(h => {
                    html += `<li>${h.timestamp} — ${h.action} (by ${h.by || 'System'})</li>`;
                });
                html += `</ul></div>`;
            }
            html += '</div>';
            viewContent.innerHTML = html;
            viewModal.classList.add('visible');
        }

        // Open Certificate Preview (for AA)
        function openCertificatePreview(app) {
            const photoHtml = app.photoURL ? `<img src="${app.photoURL}" alt="Applicant photo" />` : '<p>No photo uploaded.</p>';
            certificateContent.innerHTML = `
                <div class="certificate-preview" id="certificatePrintArea">
                    <div class="header">
                        <div class="emblem">&#9670;</div>
                        <h2>Assam Limbu Mahasabha</h2>
                        <p>Karbi Anglong &amp; Dima Hasao District Committee</p>
                        <hr style="border-color: #1a3a5c; margin: 5px 0;" />
                        <h3 style="margin: 5px 0;">Membership Certificate</h3>
                    </div>
                    <div class="body">
                        <div class="text">
                            <p><strong>This is to certify that</strong></p>
                            <p style="font-size:1.2rem; font-weight:bold;">${app.firstName} ${app.secondName}</p>
                            <p>is a registered member of the Assam Limbu Mahasabha, Karbi Anglong &amp; Dima Hasao District Committee.</p>
                            <p><strong>Membership Type:</strong> ${app.membershipType}</p>
                            <p><strong>Date of Birth:</strong> ${app.dob}</p>
                            <p><strong>District:</strong> ${app.district}</p>
                            <p><strong>Reference No:</strong> ${app.refNumber}</p>
                            <p><strong>Date of Issue:</strong> ${now()}</p>
                            <p style="margin-top:20px;"><strong>President</strong></p>
                            <p style="margin-top:5px;">_______________________<br />Signature</p>
                        </div>
                        <div class="photo">
                            ${photoHtml}
                        </div>
                    </div>
                </div>
                <div style="margin-top:var(--spacing-md); display:flex; gap:var(--spacing-md); justify-content:center;">
                    <button class="btn btn-primary" onclick="window.print()">Print Certificate</button>
                    <button class="btn btn-secondary" onclick="window.print()">Download PDF</button>
                </div>
            `;
            certificateModal.classList.add('visible');
        }

        // Close modals
        document.querySelectorAll('.close').forEach(btn => {
            btn.addEventListener('click', () => {
                const modalId = btn.dataset.modal;
                document.getElementById(modalId).classList.remove('visible');
            });
        });
        // Click outside to close
        [viewModal, certificateModal].forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('visible'); });
        });

        // Remark modal actions
        modalConfirm.addEventListener('click', async () => {
            const remark = remarkText.value.trim();
            if (!remark) { alert('Please enter a remark.'); return; }
            remarkModal.classList.remove('visible');
            if (currentAction === 'remark') {
                await addRemark(currentAppKey, remark, currentRole);
                showToast('Remark added successfully.');
            } else if (currentAction === 'forward') {
                await forwardApplication(currentAppKey, remark, currentRole);
                showToast('Application forwarded successfully.');
            }
        });
        modalCancel.addEventListener('click', () => { remarkModal.classList.remove('visible'); });
        remarkModal.addEventListener('click', (e) => { if (e.target === remarkModal) remarkModal.classList.remove('visible'); });

        // DB functions
        async function addRemark(key, remarkText, role) {
            const appRef = ref(db, `applications/${key}`);
            const snapshot = await get(appRef);
            if (!snapshot.exists()) return;
            const app = snapshot.val();
            const remarks = app.remarks || [];
            remarks.push({ by: role, text: remarkText, timestamp: now() });
            await update(appRef, { remarks });
        }

        async function forwardApplication(key, remarkText, role) {
            const appRef = ref(db, `applications/${key}`);
            const snapshot = await get(appRef);
            if (!snapshot.exists()) return;
            const app = snapshot.val();
            let nextStage = '', statusMsg = '';
            if (role === 'DA') { nextStage = 'President'; statusMsg = 'Forwarded to President'; }
            else if (role === 'President') { nextStage = 'AA'; statusMsg = 'Forwarded to Approving Authority'; }
            else { alert('Invalid role for forwarding.'); return; }
            const remarks = app.remarks || [];
            if (remarkText) remarks.push({ by: role, text: remarkText, timestamp: now() });
            const history = app.history || [];
            history.push({ action: `Forwarded to ${nextStage} by ${role}`, timestamp: now(), by: role });
            await update(appRef, { currentStage: nextStage, status: statusMsg, remarks, history });
        }

        async function updateApplicationStatus(key, finalStatus, role, remarkText) {
            const appRef = ref(db, `applications/${key}`);
            const snapshot = await get(appRef);
            if (!snapshot.exists()) return;
            const app = snapshot.val();
            const remarks = app.remarks || [];
            if (remarkText) remarks.push({ by: role, text: remarkText, timestamp: now() });
            const history = app.history || [];
            history.push({ action: `${finalStatus} by ${role}`, timestamp: now(), by: role });
            await update(appRef, { status: finalStatus, currentStage: finalStatus, approved: finalStatus === 'Approved', rejected: finalStatus === 'Rejected', finalDecision: finalStatus, remarks, history });
            showToast(`Application ${finalStatus}.`);
        }

        console.log('Admin portal loaded.');
    </script>
</body>
</html>
