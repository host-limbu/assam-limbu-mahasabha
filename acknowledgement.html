<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Acknowledgement — [Your Organization]</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ===== A4 PAGE LAYOUT (matches certificate) ===== */
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #1a3a5c;
            --border-color: #dce0e5;
            --text-muted: #475569;
            --text-color: #1e293b;
            --paper: #ffffff;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #eee;
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        /* ===== A4 PAGE ===== */
        .receipt-page {
            width: 210mm;
            min-height: 297mm;
            background: var(--paper);
            padding: 0;
        }

        /* ===== RECEIPT OUTER BORDER ===== */
        .receipt {
            width: 100%;
            min-height: 297mm;
            border: 1px solid var(--border-color);
            padding: 8mm 10mm;
            display: flex;
            flex-direction: column;
            background: var(--paper);
        }

        /* ===== HEADER ===== */
        .receipt-header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 6mm;
            margin-bottom: 8mm;
        }
        .receipt-header .logo-emblem {
            font-size: 2.8rem;
            color: var(--primary-color);
            display: block;
        }
        .receipt-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .receipt-header .sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ===== CONTENT ===== */
        .receipt-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4mm 0;
        }

        .receipt-body .greeting {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 6mm;
        }

        .receipt-body .greeting strong {
            color: var(--primary-color);
        }

        .receipt-body .message {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-color);
            margin-bottom: 6mm;
            max-width: 90%;
        }

        .receipt-body .message .highlight {
            font-weight: 600;
            color: var(--primary-color);
        }

        .receipt-body .ref-number {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-color);
            padding: 3mm 6mm;
            background: #f0f4f8;
            border-radius: 4px;
            display: inline-block;
            margin: 2mm 0 4mm 0;
            letter-spacing: 0.5px;
        }

        .receipt-body .thanks {
            font-size: 1rem;
            color: var(--text-color);
            margin-top: 4mm;
            padding-top: 4mm;
            border-top: 1px solid var(--border-color);
        }

        .receipt-body .thanks strong {
            color: var(--primary-color);
        }

        /* ===== FOOTER ===== */
        .receipt-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 3mm;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .receipt-footer .org-name {
            font-weight: 600;
            color: var(--primary-color);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-muted);
        }
        .loading-spinner .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== PRINT STYLES (matches certificate) ===== */
        @media print {
            html,
            body {
                width: 210mm;
                height: 297mm;
                background: #fff;
                padding: 0;
                margin: 0;
            }
            .receipt-page {
                width: 210mm;
                height: 297mm;
                min-height: 297mm;
                margin: 0;
            }
            .receipt {
                width: 210mm;
                height: 297mm;
                min-height: 297mm;
                page-break-inside: avoid;
                border: 1px solid #555;
            }
            .no-print {
                display: none !important;
            }
        }

        /* ===== RESPONSIVE PREVIEW ===== */
        @media screen and (max-width: 800px) {
            body {
                padding: 0;
                overflow-x: auto;
                justify-content: flex-start;
            }
            .receipt-page {
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Loading State -->
    <div id="loadingContainer" class="loading-spinner" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;">
        <div class="spinner"></div>
        <p style="margin-top:var(--spacing-md);">Loading receipt...</p>
    </div>

    <!-- Receipt (hidden initially) -->
    <main class="receipt-page" id="receiptPage" style="display:none;">
        <div class="receipt" id="receiptContainer">

            <!-- HEADER -->
            <header class="receipt-header">
                <span class="logo-emblem">&#9670;</span>
                <h1>[Your Organization]</h1>
                <p class="sub">[Your District Committee]</p>
            </header>

            <!-- BODY -->
            <div class="receipt-body" id="receiptBody">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- FOOTER -->
            <footer class="receipt-footer">
                <div>
                    <span class="org-name">[Your Organization]</span> — [Your District Committee]
                </div>
                <div>
                    <span id="generatedDate"></span>
                </div>
            </footer>

        </div>
    </main>

    <!-- Print/Download Buttons (visible only on screen) -->
    <div style="position:fixed; bottom:20px; right:20px; z-index:999; display:flex; gap:10px;" class="no-print" id="actionButtons" style="display:none;">
        <button onclick="window.print()" style="padding:10px 20px; background:#1a3a5c; color:white; border:none; border-radius:5px; cursor:pointer;">Print / PDF</button>
        <button onclick="window.close()" style="padding:10px 20px; background:#ccc; color:#222; border:none; border-radius:5px; cursor:pointer;">Close</button>
    </div>

    <!-- ============================================================ -->
    <!-- Firebase SDK -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, get } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyDp0cacuoIiLmdSjC96KSHnZkhk27S7bXI",
            authDomain: "assam-limbu-mahasabha-257ee.firebaseapp.com",
            projectId: "assam-limbu-mahasabha-257ee",
            storageBucket: "assam-limbu-mahasabha-257ee.firebasestorage.app",
            messagingSenderId: "684300836537",
            appId: "1:684300836537:web:f1080b30569f9b79634568"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loadingContainer = document.getElementById('loadingContainer');
        const receiptPage = document.getElementById('receiptPage');
        const receiptBody = document.getElementById('receiptBody');
        const actionButtons = document.getElementById('actionButtons');
        const generatedDate = document.getElementById('generatedDate');

        const urlParams = new URLSearchParams(window.location.search);
        const refNumber = urlParams.get('ref');

        if (!refNumber) {
            loadingContainer.innerHTML = '<p style="color:red;">No reference number provided.</p>';
            throw new Error('Missing ref parameter');
        }

        // Helper: format date
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // Helper: get current date for footer
        function getToday() {
            return new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        async function loadReceipt() {
            try {
                const snapshot = await get(ref(db, 'applications'));
                if (!snapshot.exists()) {
                    loadingContainer.innerHTML = '<p style="color:red;">No applications found.</p>';
                    return;
                }

                const allApps = snapshot.val();
                let app = null;
                for (const key in allApps) {
                    if (allApps[key].refNumber === refNumber) {
                        app = allApps[key];
                        break;
                    }
                }

                if (!app) {
                    loadingContainer.innerHTML = `<p style="color:red;">Application with reference ${refNumber} not found.</p>`;
                    return;
                }

                // Extract data
                const applicantName = `${app.firstName || ''} ${app.secondName || ''}`.trim() || 'Applicant';
                const membershipType = app.membershipType || 'General';
                const processingTime = '[Processing Timeframe]'; // e.g., "5-7 working days"

                // Build receipt body content
                receiptBody.innerHTML = `
                    <div class="greeting">
                        Dear <strong>${applicantName}</strong>,
                    </div>
                    <div class="message">
                        Your application for <span class="highlight">${membershipType}</span> membership
                        has been successfully submitted with reference number:
                    </div>
                    <div class="ref-number">${app.refNumber}</div>
                    <div class="message">
                        Your application will be processed within <span class="highlight">${processingTime}</span>.
                        You will be notified once the process is complete.
                    </div>
                    <div class="thanks">
                        Thank you for your trust in <strong>[Your Organization]</strong>.<br />
                        <span style="font-size:0.9rem; color:var(--text-muted);">— [Your Organization] Team</span>
                    </div>
                `;

                // Set footer date
                generatedDate.textContent = getToday();

                // Show receipt, hide loading
                loadingContainer.style.display = 'none';
                receiptPage.style.display = 'block';
                actionButtons.style.display = 'flex';

            } catch (error) {
                console.error('Error loading receipt:', error);
                loadingContainer.innerHTML = `<p style="color:red;">Error loading receipt: ${error.message}</p>`;
            }
        }

        loadReceipt();
    </script>

</body>
</html>
