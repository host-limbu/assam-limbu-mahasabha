<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — ALM Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <div class="login-brand">
                <span class="brand-icon">&#9670;</span>
                <h1>ALM Admin</h1>
                <p>Assam Limbu Mahasabha — District Committee</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" placeholder="Enter your User ID" required autofocus />
                    <div class="error-text">Please enter a valid email.</div>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required />
                    <div class="error-text">Password is required.</div>
                </div>

                <div id="loginError" class="login-error" style="display:none;"></div>

                <div class="spinner-container" id="spinnerContainer" style="height:30px; display:flex; align-items:center; justify-content:center;">
                    <div class="spinner" style="display:none;"></div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
            </form>

            <div class="login-footer">
                <span>Protected system — authorised access only</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Your Firebase config -->
    <script src="../firebase-config.js"></script>
    <!-- Auth wrapper -->
    <script src="../firebase-auth.js"></script>
    <!-- Admin utilities -->
    <script src="admin.js"></script>

    <script>
        (function() {
            'use strict';

            var form = document.getElementById('loginForm');
            var emailInput = document.getElementById('emailInput');
            var passwordInput = document.getElementById('passwordInput');
            var loginBtn = document.getElementById('loginBtn');
            var loginError = document.getElementById('loginError');
            var spinner = document.querySelector('.spinner');

            if (window.Auth && window.Auth.isAuthenticated()) {
                window.location.href = 'dashboard.html';
                return;
            }

            function showError(msg) {
                loginError.textContent = msg || 'Invalid credentials.';
                loginError.style.display = 'block';
            }

            function hideError() {
                loginError.style.display = 'none';
            }

            function setLoading(isLoading) {
                loginBtn.disabled = isLoading;
                loginBtn.textContent = isLoading ? 'Signing In...' : 'Sign In';
                spinner.style.display = isLoading ? 'inline-block' : 'none';
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                hideError();
                var email = emailInput.value.trim();
                var password = passwordInput.value;

                if (!email || !email.includes('@')) {
                    document.querySelector('#emailInput').parentElement.classList.add('has-error');
                    return;
                }
                if (!password || password.length < 6) {
                    document.querySelector('#passwordInput').parentElement.classList.add('has-error');
                    return;
                }

                setLoading(true);

                if (window.Auth && typeof window.Auth.login === 'function') {
                    window.Auth.login(email, password)
                        .then(function() {
                            setLoading(false);
                            window.location.href = 'dashboard.html';
                        })
                        .catch(function(error) {
                            setLoading(false);
                            console.error('Login error:', error);
                            var msg = 'Invalid email or password.';
                            if (error.code === 'auth/user-not-found') msg = 'No account found with this email.';
                            else if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
                            else if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
                            showError(msg);
                        });
                } else {
                    setLoading(false);
                    showError('Authentication service unavailable.');
                }
            });

            emailInput.addEventListener('input', function() {
                this.parentElement.classList.remove('has-error');
                hideError();
            });
            passwordInput.addEventListener('input', function() {
                this.parentElement.classList.remove('has-error');
                hideError();
            });

        })();
    </script>

</body>
</html>
