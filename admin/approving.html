<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approving Authority Dashboard — ALM Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="admin-wrapper">

        <div class="admin-container">

            <!-- Loading -->
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <div class="text">Loading applications...</div>
            </div>

            <div id="dashboardContent" style="display: none;">

                <div class="admin-header">
                    <div class="title">
                        <h1>Approving Authority Dashboard</h1>
                        <p>Final review and decision on membership applications</p>
                    </div>
                    <div class="user-info">
                        <span class="role-badge" id="roleBadge">Approving</span>
                        <button class="logout-btn" id="logoutBtn">Logout</button>
                        <a href="dashboard.html" class="back-btn">Back</a>
                    </div>
                </div>

                <div class="filter-tabs" id="filterTabs">
                    <button class="active" data-filter="president_review">Pending Final Review <span class="count-badge" id="pendingCount">0</span></button>
                    <button data-filter="approving_review">Finalized <span class="count-badge" id="finalizedCount">0</span></button>
                    <button data-filter="all">All Applications <span class="count-badge" id="allCount">0</span></button>
                </div>

                <div class="applications-grid" id="applicationsGrid"></div>

                <nav class="pagination" id="paginationContainer">
                    <ul class="pagination-list" id="paginationList"></ul>
                </nav>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../firebase-auth.js"></script>
    <script src="admin.js"></script>

    <script>
        (function() {
            'use strict';

            var loadingSpinner = document.getElementById('loadingSpinner');
            var dashboardContent = document.getElementById('dashboardContent');
            var applicationsGrid = document.getElementById('applicationsGrid');
            var paginationList = document.getElementById('paginationList');
            var modalOverlay = document.getElementById('detailModal');
            var modalBody = document.getElementById('modalBody');
            var modalClose = document.getElementById('modalClose');

            var allApps = [];
            var filteredApps = [];
            var currentFilter = 'president_review';
            var currentPage = 1;
            var itemsPerPage = 5;

            function getStatusBadge(status) {
                var map = {
                    'submitted': 'submitted',
                    'da_review': 'da_review',
                    'president_review': 'president_review',
                    'approving_review': 'approving_review',
                    'approved': 'approved',
                    'rejected': 'rejected'
                };
                var cls = map[status] || 'submitted';
                var label = window.Auth ? window.Auth.getStatusDisplayName(status) : status;
                return '<span class="app-status ' + cls + '">' + label + '</span>';
            }

            function formatDate(timestamp) {
                if (!timestamp) return '---';
                var d = new Date(timestamp);
                return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function formatDateTime(timestamp) {
                if (!timestamp) return '---';
                var d = new Date(timestamp);
                return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            }

            function renderApplications(apps) {
                if (!apps || apps.length === 0) {
                    applicationsGrid.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">&#9670;</span>
                            <h3 style="color: var(--admin-text);">No applications found</h3>
                            <p>There are no applications in this category.</p>
                        </div>
                    `;
                    return;
                }

                var html = '';
                apps.forEach(function(app) {
                    var name = (app.firstName || '') + ' ' + (app.secondName || '');
                    var ref = app.referenceNumber || '---';
                    var type = app.membershipType || '---';
                    var status = app.status || 'submitted';
                    var submittedAt = app.submittedAt;

                    var daRemark = app.daRemark ? app.daRemark.text : '';
                    var presRemark = app.presidentRemark ? app.presidentRemark.text : '';
                    var remarksDisplay = (daRemark || presRemark) ? `
                        <div style="font-size:0.8rem;color:var(--admin-text-muted);margin-top:0.2rem;">
                            ${daRemark ? '<strong>DA:</strong> "' + daRemark + '"<br/>' : ''}
                            ${presRemark ? '<strong>President:</strong> "' + presRemark + '"' : ''}
                        </div>
                    ` : '';

                    var showActions = status === 'president_review';

                    html += `
                        <div class="app-card">
                            <div class="app-header">
                                <span class="app-ref">${ref}</span>
                                ${getStatusBadge(status)}
                            </div>
                            <div class="app-details">
                                <div class="detail-item"><strong>Name:</strong> ${name}</div>
                                <div class="detail-item"><strong>Type:</strong> ${type}</div>
                                <div class="detail-item"><strong>Email:</strong> ${app.email || '---'}</div>
                                <div class="detail-item"><strong>Submitted:</strong> ${formatDate(submittedAt)}</div>
                            </div>
                            ${remarksDisplay}
                            <div class="app-actions">
                                <button class="btn btn-secondary view-btn" data-ref="${ref}">View Details</button>
                                ${showActions ? `
                                    <button class="btn btn-success approve-btn" data-ref="${ref}">Approve</button>
                                    <button class="btn btn-danger reject-btn" data-ref="${ref}">Reject</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                applicationsGrid.innerHTML = html;

                document.querySelectorAll('.view-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var ref = this.getAttribute('data-ref');
                        openDetailModal(ref);
                    });
                });

                document.querySelectorAll('.approve-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var ref = this.getAttribute('data-ref');
                        openDecisionModal(ref, 'approved');
                    });
                });

                document.querySelectorAll('.reject-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var ref = this.getAttribute('data-ref');
                        openDecisionModal(ref, 'rejected');
                    });
                });
            }

            function renderPagination(totalItems) {
                var totalPages = Math.ceil(totalItems / itemsPerPage);
                if (totalPages <= 1) {
                    paginationList.innerHTML = '';
                    return;
                }

                var html = '';
                html += '<li class="page-prev">';
                if (currentPage > 1) {
                    html += '<a href="#" data-page="' + (currentPage - 1) + '">&laquo;</a>';
                } else {
                    html += '<span class="page-dots">&laquo;</span>';
                }
                html += '</li>';

                for (var i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        html += '<li class="active"><span>' + i + '</span></li>';
                    } else {
                        html += '<li><a href="#" data-page="' + i + '">' + i + '</a></li>';
                    }
                }

                html += '<li class="page-next">';
                if (currentPage < totalPages) {
                    html += '<a href="#" data-page="' + (currentPage + 1) + '">&raquo;</a>';
                } else {
                    html += '<span class="page-dots">&raquo;</span>';
                }
                html += '</li>';

                paginationList.innerHTML = html;

                paginationList.querySelectorAll('a[data-page]').forEach(function(link) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        var page = parseInt(this.getAttribute('data-page'), 10);
                        if (page >= 1 && page <= totalPages) {
                            currentPage = page;
                            updateView();
                        }
                    });
                });
            }

            function updateView() {
                if (currentFilter === 'all') {
                    filteredApps = allApps;
                } else {
                    filteredApps = allApps.filter(function(app) {
                        return app.status === currentFilter;
                    });
                }

                var start = (currentPage - 1) * itemsPerPage;
                var end = start + itemsPerPage;
                var pageApps = filteredApps.slice(start, end);

                renderApplications(pageApps);
                renderPagination(filteredApps.length);
            }

            function fetchApplications() {
                var db = window.db;
                db.ref('applications').once('value')
                    .then(function(snapshot) {
                        var data = snapshot.val();
                        allApps = [];

                        if (data) {
                            Object.keys(data).forEach(function(key) {
                                var app = data[key];
                                app._key = key;
                                allApps.push(app);
                            });

                            allApps.sort(function(a, b) {
                                return (b.submittedAt || 0) - (a.submittedAt || 0);
                            });
                        }

                        var presReviewCount = allApps.filter(function(a) { return a.status === 'president_review'; }).length;
                        var approvReviewCount = allApps.filter(function(a) { return a.status === 'approving_review' || a.status === 'approved' || a.status === 'rejected'; }).length;

                        document.getElementById('pendingCount').textContent = presReviewCount;
                        document.getElementById('finalizedCount').textContent = approvReviewCount;
                        document.getElementById('allCount').textContent = allApps.length;

                        currentFilter = 'president_review';
                        currentPage = 1;
                        updateView();

                        loadingSpinner.style.display = 'none';
                        dashboardContent.style.display = 'block';
                    })
                    .catch(function(err) {
                        console.error('Error fetching applications:', err);
                        loadingSpinner.style.display = 'none';
                        dashboardContent.style.display = 'block';
                        applicationsGrid.innerHTML = `
                            <div class="empty-state">
                                <span class="icon">&#9670;</span>
                                <h3 style="color: var(--admin-text);">Error loading applications</h3>
                                <p>${err.message || 'Please try again later.'}</p>
                            </div>
                        `;
                    });
            }

            function openDetailModal(ref) {
                var app = allApps.find(function(a) { return a.referenceNumber === ref; });
                if (!app) return;

                var name = (app.firstName || '') + ' ' + (app.secondName || '');

                var html = `
                    <div class="modal-title">Application Details</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--admin-spacing-sm); margin-bottom: var(--admin-spacing-md);">
                        <div><strong>Reference:</strong> ${app.referenceNumber}</div>
                        <div>${getStatusBadge(app.status)}</div>
                    </div>

                    <div class="photo-section">
                        ${app.photoURL ? '<img src="' + app.photoURL + '" alt="Passport photo" />' : '<span class="no-photo">No photo uploaded</span>'}
                    </div>

                    <div class="detail-row">
                        <div><span class="label">Name</span><div class="value">${name}</div></div>
                        <div><span class="label">Membership Type</span><div class="value">${app.membershipType || '---'}</div></div>
                        <div><span class="label">Date of Birth</span><div class="value">${app.dob || '---'}</div></div>
                        <div><span class="label">Blood Group</span><div class="value">${app.bloodGroup || '---'}</div></div>
                        <div><span class="label">Email</span><div class="value">${app.email || '---'}</div></div>
                        <div><span class="label">Phone</span><div class="value">${app.phone || '---'}</div></div>
                        <div><span class="label">Education</span><div class="value">${app.education || '---'}${app.otherEducation ? ' (' + app.otherEducation + ')' : ''}</div></div>
                        <div><span class="label">District</span><div class="value">${app.address ? app.address.district : '---'}</div></div>
                        <div><span class="label">Village</span><div class="value">${app.address ? app.address.village : '---'}</div></div>
                        <div><span class="label">PIN</span><div class="value">${app.address ? app.address.pin : '---'}</div></div>
                        <div><span class="label">Family Members</span><div class="value">${app.family ? app.family.totalMembers : '---'}</div></div>
                        <div><span class="label">Submitted On</span><div class="value">${formatDateTime(app.submittedAt)}</div></div>
                    </div>

                    <div class="history-section">
                        <h4>Application Timeline</h4>
                        ${renderHistoryHtml(app.history)}
                    </div>

                    ${app.daRemark ? '<div style="margin-top: var(--admin-spacing-sm); padding: var(--admin-spacing-sm); background: var(--admin-surface-alt); border-radius: var(--admin-radius);"><strong>DA Remark:</strong> ' + app.daRemark.text + ' <span style="color: var(--admin-text-muted); font-size: 0.8rem;">(' + formatDateTime(app.daRemark.timestamp) + ')</span></div>' : ''}
                    ${app.presidentRemark ? '<div style="margin-top: var(--admin-spacing-sm); padding: var(--admin-spacing-sm); background: var(--admin-surface-alt); border-radius: var(--admin-radius);"><strong>President Remark:</strong> ' + app.presidentRemark.text + ' <span style="color: var(--admin-text-muted); font-size: 0.8rem;">(' + formatDateTime(app.presidentRemark.timestamp) + ')</span></div>' : ''}
                    ${app.approvingRemark ? '<div style="margin-top: var(--admin-spacing-sm); padding: var(--admin-spacing-sm); background: var(--admin-surface-alt); border-radius: var(--admin-radius);"><strong>Approving Remark:</strong> ' + app.approvingRemark.text + ' <span style="color: var(--admin-text-muted); font-size: 0.8rem;">(' + formatDateTime(app.approvingRemark.timestamp) + ')</span></div>' : ''}
                    ${app.finalDecision ? '<div style="margin-top: var(--admin-spacing-sm); padding: var(--admin-spacing-sm); background: ' + (app.finalDecision.status === 'approved' ? '#e8f5e9' : '#fce4ec') + '; border-radius: var(--admin-radius);"><strong>Final Decision:</strong> ' + app.finalDecision.status.toUpperCase() + ' — ' + (app.finalDecision.remark || '') + ' <span style="color: var(--admin-text-muted); font-size: 0.8rem;">(' + formatDateTime(app.finalDecision.timestamp) + ')</span></div>' : ''}
                `;

                modalBody.innerHTML = html;
                modalOverlay.classList.add('active');
            }

            function renderHistoryHtml(history) {
                if (!history || history.length === 0) {
                    return '<p style="color: var(--admin-text-muted); font-size: 0.9rem;">No history available.</p>';
                }
                var html = '';
                var sorted = history.slice().sort(function(a, b) {
                    return (a.timestamp || 0) - (b.timestamp || 0);
                });
                sorted.forEach(function(item) {
                    var roleLabel = item.actorRole ? item.actorRole.charAt(0).toUpperCase() + item.actorRole.slice(1) : 'System';
                    html += `
                        <div class="history-item">
                            <span class="h-time">${formatDateTime(item.timestamp)}</span>
                            <span class="h-action">${item.action ? item.action.replace(/_/g, ' ').toUpperCase() : ''}</span>
                            ${item.remark ? '<span class="h-remark">— "' + item.remark + '"</span>' : ''}
                            <span style="color: var(--admin-text-muted); font-size: 0.75rem; margin-left: 0.5rem;">(${roleLabel})</span>
                        </div>
                    `;
                });
                return html;
            }

            function openDecisionModal(ref, decision) {
                var app = allApps.find(function(a) { return a.referenceNumber === ref; });
                if (!app) return;

                var name = (app.firstName || '') + ' ' + (app.secondName || '');
                var decisionLabel = decision === 'approved' ? 'Approve' : 'Reject';
                var decisionColor = decision === 'approved' ? '#27ae60' : '#e74c3c';

                var html = `
                    <div class="modal-title">${decisionLabel} Application</div>
                    <p style="color: var(--admin-text-muted); margin-bottom: var(--admin-spacing-md);">
                        You are about to <strong style="color:${decisionColor}">${decisionLabel}</strong> the membership application of <strong>${name}</strong> (${app.referenceNumber}).
                    </p>

                    <div style="background: var(--admin-surface-alt); padding: var(--admin-spacing-sm); border-radius: var(--admin-radius); margin-bottom: var(--admin-spacing-md);">
                        <strong>DA Remark:</strong> ${app.daRemark ? '"' + app.daRemark.text + '"' : 'No DA remark provided.'}<br/>
                        <strong>President Remark:</strong> ${app.presidentRemark ? '"' + app.presidentRemark.text + '"' : 'No President remark provided.'}
                    </div>

                    <div class="remark-section">
                        <label for="decisionRemark" style="display: block; font-weight: 500; margin-bottom: var(--admin-spacing-xs);">Final Remark <span style="color: var(--admin-text-muted); font-size: 0.85rem;">(${decision === 'approved' ? 'e.g. Application approved.' : 'e.g. Application rejected due to incomplete information.'})</span></label>
                        <textarea id="decisionRemark" placeholder="${decision === 'approved' ? 'Application approved.' : 'Application rejected.'}"></textarea>
                        <div class="remark-actions">
                            <button class="btn ${decision === 'approved' ? 'btn-success' : 'btn-danger'}" id="confirmDecision" data-ref="${ref}" data-decision="${decision}">Confirm ${decisionLabel}</button>
                            <button class="btn btn-secondary" id="cancelDecision">Cancel</button>
                        </div>
                    </div>
                `;

                modalBody.innerHTML = html;
                modalOverlay.classList.add('active');

                document.getElementById('cancelDecision').addEventListener('click', function() {
                    modalOverlay.classList.remove('active');
                });

                document.getElementById('confirmDecision').addEventListener('click', function() {
                    var ref = this.getAttribute('data-ref');
                    var decision = this.getAttribute('data-decision');
                    var remark = document.getElementById('decisionRemark').value.trim() || (decision === 'approved' ? 'Application approved.' : 'Application rejected.');
                    confirmDecision(ref, decision, remark);
                });
            }

            function confirmDecision(ref, decision, remark) {
                var db = window.db;
                var appRef = db.ref('applications/' + ref);

                appRef.once('value')
                    .then(function(snapshot) {
                        var app = snapshot.val();
                        if (!app) {
                            alert('Application not found.');
                            modalOverlay.classList.remove('active');
                            return;
                        }

                        var newStatus = decision;
                        var updates = {
                            status: newStatus,
                            updatedAt: Date.now(),
                            approvingRemark: {
                                text: remark,
                                timestamp: Date.now()
                            },
                            finalDecision: {
                                status: newStatus,
                                remark: remark,
                                timestamp: Date.now()
                            }
                        };

                        if (newStatus === 'approved') {
                            updates.certificateIssuedAt = Date.now();
                        }

                        var historyEntry = {
                            action: newStatus === 'approved' ? 'approved' : 'rejected',
                            actorUID: window.Auth ? window.Auth.getCurrentUser().uid : 'unknown',
                            actorRole: 'approving',
                            remark: remark,
                            timestamp: Date.now(),
                            fromStatus: app.status || 'president_review',
                            toStatus: newStatus
                        };

                        var historyRef = appRef.child('history');
                        historyRef.push(historyEntry);

                        appRef.update(updates)
                            .then(function() {
                                modalOverlay.classList.remove('active');
                                fetchApplications();
                            })
                            .catch(function(err) {
                                console.error('Error updating application:', err);
                                alert('Failed to process decision. Please try again.');
                            });
                    })
                    .catch(function(err) {
                        console.error('Error fetching application:', err);
                        alert('Failed to process. Please try again.');
                    });
            }

            // Modal close
            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
            });
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                }
            });

            // Filter tabs
            document.querySelectorAll('#filterTabs button').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('#filterTabs button').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-filter');
                    currentPage = 1;
                    updateView();
                });
            });

            // Auth check
            function checkAuth() {
                if (!window.Auth) {
                    window.location.href = 'login.html';
                    return;
                }

                var user = window.Auth.getCurrentUser();
                var role = window.Auth.getCurrentUserRole();

                if (!user || !role) {
                    window.location.href = 'login.html';
                    return;
                }

                if (role !== 'approving') {
                    window.location.href = 'dashboard.html';
                    return;
                }

                document.getElementById('roleBadge').textContent = 'Approving';
                fetchApplications();
            }

            if (window.Auth) {
                if (window.Auth.isAuthenticated()) {
                    checkAuth();
                } else {
                    window.Auth.onAuthStateChanged(function(user, role) {
                        if (user && role) {
                            checkAuth();
                        } else {
                            window.location.href = 'login.html';
                        }
                    });
                }
            } else {
                window.location.href = 'login.html';
            }

        })();
    </script>

</body>
</html>
