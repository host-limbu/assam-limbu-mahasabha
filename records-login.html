<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Records — [Your Organization]</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="filter.css" />
    <link rel="stylesheet" href="global-table.css" />
    <!-- REMOVED: global-login.css, rec-log.css -->
    <style>
        /* ===== EXACT SAME LOGIN STYLES AS admin.html ===== */
        .admin-login-form {
            max-width: 400px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }
        .admin-login-form input {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-bottom: var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            background: var(--color-surface);
        }
        .admin-login-form input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .admin-login-form .btn {
            width: 100%;
        }
        .admin-dashboard { display: none; }
        .admin-dashboard.visible { display: block; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .admin-header h2 { margin: 0; }
        .admin-role-badge {
            background: var(--color-primary);
            color: #fff;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: var(--font-medium);
        }
        .error-message {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: var(--spacing-sm);
            display: none;
        }
        .error-message.visible { display: block; }
        .toast {
            position: fixed;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            display: none;
            max-width: 400px;
        }
        .toast.visible { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--color-border);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .records-empty {
            text-align: center;
            color: var(--color-text-muted);
            padding: var(--spacing-xl);
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            background: var(--color-border);
            color: var(--color-text-muted);
            border-color: var(--color-border);
        }
        .actions .btn { padding: 0.15rem 0.4rem; font-size: 0.7rem; }
        @media (max-width: 768px) { /* ... responsive styles ... */ }
    </style>
</head>
<body>
    <!-- ===== HEADER (same as admin.html) ===== -->
    <header class="site-header">...</header>

    <main class="site-main">
        <section class="full-width" style="background: #ffffff; border-bottom: 1px solid var(--color-border);">
            <div class="section-content">
                <h2 style="text-align: center;">Certificate Records <span style="font-size:0.7rem; background:var(--color-primary); color:#fff; padding:0.2rem 0.8rem; border-radius:20px; text-transform:uppercase; letter-spacing:0.05em; margin-left:0.5rem;">Demo</span></h2>
                <p style="color: var(--color-text-muted); text-align: center; max-width: 600px; margin: 0 auto var(--spacing-lg);">
                    View all membership applications and their certificate status.
                </p>

                <!-- ===== LOGIN SECTION (identical to admin.html) ===== -->
                <div id="loginSection" class="admin-login-section">
                    <div class="admin-login-form">
                        <h3 style="text-align: center; margin-top: 0;">Sign In</h3>
                        <form id="loginForm">
                            <input type="email" id="loginEmail" placeholder="Email" required />
                            <input type="password" id="loginPassword" placeholder="Password" required />
                            <div id="loginError" class="error-message">Invalid credentials.</div>
                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </form>
                    </div>
                </div>

                <!-- ===== DASHBOARD (identical to admin.html structure) ===== -->
                <div id="dashboard" class="admin-dashboard">
                    <div class="admin-header">
                        <div><h2>Dashboard</h2><span id="roleBadge" class="admin-role-badge">Role</span></div>
                        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                    </div>
                    <!-- Filter Bar -->
                    <div class="filter-bar" id="filterBar">
                        <div class="filter-group">
                            <label for="searchInput">Search</label>
                            <input type="text" id="searchInput" placeholder="Name or Ref No..." />
                        </div>
                        <div class="filter-group">
                            <label for="statusFilter">Status</label>
                            <select id="statusFilter">
                                <option value="">All Status</option>
                                <option value="Submitted">Submitted</option>
                                <option value="Under Processed">Under Processed</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-apply" id="applyFilterBtn">Apply Filters</button>
                            <button class="btn btn-clear" id="clearFilterBtn">Clear</button>
                            <span class="filter-result-info" id="resultCount"></span>
                        </div>
                    </div>
                    <div id="recordsContainer"><div class="spinner" style="margin: var(--spacing-xl) auto; display:block;"></div></div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== FOOTER (same as global) ===== -->
    <footer class="site-footer">...</footer>

    <!-- ===== FIREBASE + AUTH (fixed) ===== -->
    <script type="importmap">...</script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
        import { getDatabase, ref, onValue } from "firebase/database";

        // ... same config ...

        // Auth state with re-entrancy guard and session storage (same as admin.html)
        let authProcessing = false;
        onAuthStateChanged(auth, async (user) => {
            if (authProcessing) return;
            authProcessing = true;
            try {
                if (user) {
                    const storedUID = sessionStorage.getItem('recordsUID');
                    if (storedUID === user.uid) {
                        // Already logged in
                        loginSection.style.display = 'none';
                        dashboard.classList.add('visible');
                        roleBadge.textContent = 'Administrator';
                        loadRecords();
                        authProcessing = false;
                        return;
                    }
                    // Check if user is allowed (hardcoded for demo)
                    const ALLOWED_UID = 'l4GzCvIUW8RjUo188W3RGV7mQbe2';
                    if (user.uid === ALLOWED_UID) {
                        sessionStorage.setItem('recordsUID', user.uid);
                        loginSection.style.display = 'none';
                        dashboard.classList.add('visible');
                        roleBadge.textContent = 'Administrator';
                        loadRecords();
                    } else {
                        alert('You are not authorized to view this page.');
                        await signOut(auth);
                        sessionStorage.removeItem('recordsUID');
                    }
                } else {
                    sessionStorage.removeItem('recordsUID');
                    loginSection.style.display = 'block';
                    dashboard.classList.remove('visible');
                    recordsContainer.innerHTML = '';
                }
            } catch (e) {
                console.error(e);
            } finally {
                authProcessing = false;
            }
        });

        // ... rest of records logic (loadRecords, filterApplications, renderTable) unchanged ...
        // renderTable now also uses btn-disabled for non-approved certificates
    </script>
</body>
</html>
